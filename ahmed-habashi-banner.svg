<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1226"/>
      <stop offset="0.55" stop-color="#121829"/>
      <stop offset="1" stop-color="#1c1f29"/>
    </linearGradient>
    <radialGradient id="glowR" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#1f7bff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#1f7bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowO" cx="0.97" cy="0.95" r="0.25">
      <stop offset="0" stop-color="#ff8a2a" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ff8a2a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4db3ff"/>
      <stop offset="1" stop-color="#2563ff"/>
    </linearGradient>
    <linearGradient id="phoneEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5d6678"/>
      <stop offset="0.5" stop-color="#262b38"/>
      <stop offset="1" stop-color="#4a5266"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3da5ff"/>
      <stop offset="1" stop-color="#3a3fd8"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#8fb4ff" opacity="0.12"/>
    </pattern>
    <filter id="shadow" x="-40%" y="-20%" width="180%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="screen"><rect x="8" y="8" width="194" height="384" rx="28"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#dots)"/>
  <rect width="1600" height="500" fill="url(#glowR)"/>
  <rect width="1600" height="500" fill="url(#glowO)"/>

  <!-- Flutter-inspired geometric shapes (abstract) -->
  <g opacity="0.9">
    <polygon points="880,330 960,250 1000,250 920,330" fill="#2f7bff" opacity="0.28"/>
    <polygon points="920,330 1000,410 960,410 880,330" fill="#2f7bff" opacity="0.16"/>
    <polygon points="1450,90 1510,150 1480,150 1420,90" fill="#4db3ff" opacity="0.30"/>
    <polygon points="1420,150 1480,150 1510,180 1450,180" fill="#4db3ff" opacity="0.14"/>
    <rect x="1010" y="64" width="26" height="26" rx="5" transform="rotate(45 1023 77)" fill="none" stroke="#ff8a2a" stroke-opacity="0.55" stroke-width="2"/>
    <circle cx="1440" cy="400" r="34" fill="none" stroke="#4db3ff" stroke-opacity="0.25" stroke-width="2"/>
    <circle cx="1440" cy="400" r="5" fill="#ff8a2a" opacity="0.8"/>
  </g>

  <!-- Code symbols -->
  <g font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace" fill="#9fc3ff" opacity="0.3">
    <text x="900" y="120" font-size="38" font-weight="600">&lt;/&gt;</text>
    <text x="1420" y="300" font-size="40" font-weight="600">{ }</text>
    <text x="1000" y="450" font-size="30">();</text>
    <text x="1480" y="440" font-size="30">=&gt;</text>
  </g>

  <!-- Phone mockup -->
  <g transform="translate(1130 50)" filter="url(#shadow)">
    <rect x="0" y="0" width="210" height="400" rx="36" fill="url(#phoneEdge)"/>
    <rect x="3" y="3" width="204" height="394" rx="33" fill="#0b0e16"/>
    <rect x="8" y="8" width="194" height="384" rx="28" fill="#0e1730"/>
    <g clip-path="url(#screen)">
      <rect x="8" y="8" width="194" height="150" fill="#13204a" opacity="0.6"/>
      <!-- status / notch -->
      <rect x="75" y="16" width="60" height="14" rx="7" fill="#05080f"/>
      <!-- header -->
      <rect x="24" y="50" width="70" height="7" rx="3.5" fill="#8fa3c8"/>
      <rect x="24" y="64" width="116" height="12" rx="6" fill="#ffffff"/>
      <circle cx="172" cy="64" r="14" fill="#ff8a2a"/>
      <!-- hero card -->
      <rect x="22" y="96" width="166" height="92" rx="18" fill="url(#hero)"/>
      <rect x="36" y="112" width="70" height="8" rx="4" fill="#ffffff" opacity="0.9"/>
      <rect x="36" y="128" width="104" height="6" rx="3" fill="#ffffff" opacity="0.5"/>
      <rect x="36" y="156" width="54" height="18" rx="9" fill="#ff8a2a"/>
      <circle cx="158" cy="148" r="22" fill="#ffffff" opacity="0.14"/>
      <!-- tiles -->
      <rect x="22" y="204" width="50" height="50" rx="14" fill="#1a2547"/>
      <rect x="80" y="204" width="50" height="50" rx="14" fill="#1a2547"/>
      <rect x="138" y="204" width="50" height="50" rx="14" fill="#1a2547"/>
      <circle cx="47" cy="229" r="9" fill="#4db3ff"/>
      <rect x="99" y="220" width="12" height="18" rx="3" fill="#4db3ff"/>
      <polygon points="163,219 175,239 151,239" fill="#ff8a2a"/>
      <!-- list -->
      <rect x="22" y="270" width="166" height="38" rx="12" fill="#16203f"/>
      <circle cx="42" cy="289" r="10" fill="#2f7bff"/>
      <rect x="60" y="282" width="80" height="6" rx="3" fill="#dfe7fb"/>
      <rect x="60" y="294" width="54" height="5" rx="2.5" fill="#6f80a8"/>
      <rect x="22" y="316" width="166" height="38" rx="12" fill="#16203f"/>
      <circle cx="42" cy="335" r="10" fill="#ff8a2a"/>
      <rect x="60" y="328" width="70" height="6" rx="3" fill="#dfe7fb"/>
      <rect x="60" y="340" width="46" height="5" rx="2.5" fill="#6f80a8"/>
      <!-- nav -->
      <rect x="30" y="362" width="150" height="24" rx="12" fill="#1a2547"/>
      <circle cx="62" cy="374" r="4.5" fill="#ff8a2a"/>
      <circle cx="105" cy="374" r="4.5" fill="#6f80a8"/>
      <circle cx="148" cy="374" r="4.5" fill="#6f80a8"/>
    </g>
    <!-- glass highlight -->
    <path d="M8 60 Q8 8 60 8 L120 8 L8 150 Z" fill="#ffffff" opacity="0.04"/>
  </g>

  <!-- Text -->
  <g font-family="Inter,'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <rect x="100" y="112" width="56" height="4" rx="2" fill="#ff8a2a"/>
    <text x="100" y="186" font-size="66" font-weight="800" fill="#ffffff" letter-spacing="1.5">AHMED HABASHI</text>
    <text x="102" y="240" font-size="26" font-weight="700" fill="url(#blue)" letter-spacing="8">FLUTTER DEVELOPER</text>
    <text x="102" y="296" font-size="22" font-weight="500" fill="#c9d3ea">Building Clean &amp; Scalable Mobile Applications</text>
    <text x="102" y="346" font-size="19" font-weight="600" fill="#7f93bd" letter-spacing="1">Flutter  •  Dart  •  REST APIs</text>
  </g>
</svg>
